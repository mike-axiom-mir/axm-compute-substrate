name: verifier-wave90-lineage

on:
  pull_request:
    paths:
      - 'verification/WAVE90_ADVERSARIAL_VERIFICATION_2026-09-16.md'
      - 'verification/wave90_evaluator_replacement_lineage_repro.py'
      - 'tools/AXM_FLOWING_COMPUTE_EVALUATOR_PROVENANCE.py'
      - '.github/workflows/verifier-wave90-lineage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce Wave 90 evaluator replacement lineage gap
        run: python verification/wave90_evaluator_replacement_lineage_repro.py
