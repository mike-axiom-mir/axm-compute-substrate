name: Verifier Wave 135 pending-private temp residue

on:
  push:
    branches:
      - verifier/wave135-pending-private-temp-residue
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Environment identity
        run: |
          python --version
          openssl version
          uname -a
          id
          grep -E '^(Uid|Gid|CapPrm|CapEff|NoNewPrivs):' /proc/self/status || true
          sudo -n true

      - name: Stage UID-neutral test code
        run: |
          sudo rm -rf /tmp/axm-w135v-code
          sudo mkdir -p /tmp/axm-w135v-code/tools /tmp/axm-w135v-code/verification
          sudo cp -a tools/. /tmp/axm-w135v-code/tools/
          sudo cp verification/wave135_pending_private_temp_residue_repro.py /tmp/axm-w135v-code/verification/
          sudo find /tmp/axm-w135v-code -type d -exec chmod 0755 {} +
          sudo find /tmp/axm-w135v-code -type f -exec chmod 0644 {} +

      - name: Unchanged Wave 135 control normal
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w135v-code/tools HOME=/tmp python /tmp/axm-w135v-code/tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ROTATION_PUBLICATION_RECOVERY_SELFTEST.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/wave135-control-normal.json' sh "$worker_uid"

      - name: Unchanged Wave 135 control optimized
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w135v-code/tools HOME=/tmp python -O /tmp/axm-w135v-code/tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ROTATION_PUBLICATION_RECOVERY_SELFTEST.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/wave135-control-optimized.json' sh "$worker_uid"

      - name: Pending-private adversarial gate normal
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w135v-code/tools HOME=/tmp python /tmp/axm-w135v-code/verification/wave135_pending_private_temp_residue_repro.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/wave135-pending-private-normal.json' sh "$worker_uid"

      - name: Pending-private adversarial gate optimized
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w135v-code/tools HOME=/tmp python -O /tmp/axm-w135v-code/verification/wave135_pending_private_temp_residue_repro.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/wave135-pending-private-optimized.json' sh "$worker_uid"

      - name: Exact source identity
        run: |
          git rev-parse HEAD > /tmp/verifier-head.txt
          git rev-parse HEAD^ > /tmp/verifier-parent.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ROTATION_PUBLICATION_RECOVERY.py > /tmp/wave135-tool-blob.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ROTATION_PUBLICATION_RECOVERY_SELFTEST.py > /tmp/wave135-selftest-blob.txt
          git rev-parse HEAD:verification/wave135_pending_private_temp_residue_repro.py > /tmp/verifier-script-blob.txt
          git rev-parse HEAD:.github/workflows/verifier-wave135-pending-private-temp-residue.yml > /tmp/verifier-workflow-blob.txt

      - name: Upload exact verifier evidence
        uses: actions/upload-artifact@v4
        with:
          name: wave135-pending-private-temp-residue-verifier
          path: |
            /tmp/wave135-control-normal.json
            /tmp/wave135-control-optimized.json
            /tmp/wave135-pending-private-normal.json
            /tmp/wave135-pending-private-optimized.json
            /tmp/verifier-head.txt
            /tmp/verifier-parent.txt
            /tmp/wave135-tool-blob.txt
            /tmp/wave135-selftest-blob.txt
            /tmp/verifier-script-blob.txt
            /tmp/verifier-workflow-blob.txt
          if-no-files-found: error
