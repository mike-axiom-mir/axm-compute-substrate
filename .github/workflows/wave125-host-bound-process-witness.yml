name: wave125-host-bound-process-witness

on:
  push:
    branches:
      - chatgpt/lane-001-platform-extract
    paths:
      - tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_HOSTBOUND.py
      - tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_HOSTBOUND_SELFTEST.py
      - .github/workflows/wave125-host-bound-process-witness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare report directory
        run: mkdir -p wave125-report
      - name: Syntax check exact Wave 125 tools
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: python -m py_compile tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_HOSTBOUND.py tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_HOSTBOUND_SELFTEST.py
      - name: Wave 124 unchanged regression
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: python tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_EXCLUSIVE_SELFTEST.py --report wave125-report/wave124-regression.json
      - name: Wave 124 unchanged regression optimized
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: python -O tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_EXCLUSIVE_SELFTEST.py --report wave125-report/wave124-regression-optimized.json
      - name: Wave 125 exact-source self-test
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: python tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_HOSTBOUND_SELFTEST.py --report wave125-report/wave125.json
      - name: Wave 125 optimized-mode self-test
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: python -O tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_HOSTBOUND_SELFTEST.py --report wave125-report/wave125-optimized.json
      - name: Record exact source identity
        if: always()
        run: |
          python - <<'PY'
          import json, subprocess
          files = [
              'tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_HOSTBOUND.py',
              'tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_HOSTBOUND_SELFTEST.py',
              '.github/workflows/wave125-host-bound-process-witness.yml',
              'tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_EXCLUSIVE.py',
              'tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_EXCLUSIVE_SELFTEST.py',
              'tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS.py',
          ]
          out = {
              'tested_source_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'blobs': {path: subprocess.check_output(['git','hash-object',path], text=True).strip() for path in files},
              'wave124_evidence_head': '27ccee01297feaa9dac169a00d6af456979f606b',
              'wave124_tested_source_commit': '959e4c46e7c2ecf8e2043ebaa177b696d7d35f31',
              'verifier_pr': 49,
              'verifier_evidence_head': '45f082097f415151879a9aadb33553118f4a80d3',
              'verifier_tested_head': '8a64415d9d2e93dc405e254fb2bc04be5841093e',
              'verifier_artifact_sha256': '00c75622e0902114fba5acb81c87b0eb24e826a78bd03035fe5a3e407f7a8ad3',
              'truth_boundary': 'same Linux network namespace plus one OS-user host-pin namespace, cooperating Wave 125 servers; bootstrap and whole witness+host-pin rollback remain boundaries; no physical/provider/performance/energy/retained-compute claim',
          }
          with open('wave125-report/source-identity.json','w',encoding='utf-8') as f:
              json.dump(out,f,indent=2,sort_keys=True); f.write('\n')
          PY
      - name: Upload machine-readable run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave125-report
          path: wave125-report/
          if-no-files-found: warn
