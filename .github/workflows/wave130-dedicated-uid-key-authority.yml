name: Wave 130 dedicated UID key authority

on:
  push:
    branches:
      - chatgpt/lane-001-platform-extract
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave130:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Environment identity
        run: |
          python --version
          openssl version
          uname -a
          id
          grep -E '^(Uid|Gid|CapEff|NoNewPrivs):' /proc/self/status || true
          cat /proc/sys/kernel/yama/ptrace_scope || true
          sudo -n true

      - name: Unchanged Wave 129 lifecycle normal
        env:
          PYTHONPATH: tools
        run: |
          python tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_KEY_LIFECYCLE_CI.py --report /tmp/wave129-normal.json

      - name: Unchanged Wave 129 lifecycle optimized
        env:
          PYTHONPATH: tools
        run: |
          python -O tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_KEY_LIFECYCLE_CI.py --report /tmp/wave129-optimized.json

      - name: Wave 130 dedicated UID authority normal
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH="$1/tools" HOME=/tmp python "$1/tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_KEY_AUTHORITY_BOUNDARY_SELFTEST.py" --worker-uid "$2" --anchor-uid 23001 --report /tmp/wave130-normal.json' sh "$PWD" "$worker_uid"

      - name: Wave 130 dedicated UID authority optimized
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH="$1/tools" HOME=/tmp python -O "$1/tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_KEY_AUTHORITY_BOUNDARY_SELFTEST.py" --worker-uid "$2" --anchor-uid 23001 --report /tmp/wave130-optimized.json' sh "$PWD" "$worker_uid"

      - name: Exact source identity
        run: |
          git rev-parse HEAD > /tmp/tested-head.txt
          git rev-parse HEAD^ > /tmp/tested-parent.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_KEY_LIFECYCLE.py > /tmp/wave129-tool-blob.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_KEY_AUTHORITY_BOUNDARY.py > /tmp/wave130-tool-blob.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_KEY_AUTHORITY_BOUNDARY_SELFTEST.py > /tmp/wave130-selftest-blob.txt
          git rev-parse HEAD:.github/workflows/wave130-dedicated-uid-key-authority.yml > /tmp/wave130-workflow-blob.txt

      - name: Upload exact Wave 130 evidence
        uses: actions/upload-artifact@v4
        with:
          name: wave130-dedicated-uid-key-authority
          path: |
            /tmp/wave129-normal.json
            /tmp/wave129-optimized.json
            /tmp/wave130-normal.json
            /tmp/wave130-optimized.json
            /tmp/tested-head.txt
            /tmp/tested-parent.txt
            /tmp/wave129-tool-blob.txt
            /tmp/wave130-tool-blob.txt
            /tmp/wave130-selftest-blob.txt
            /tmp/wave130-workflow-blob.txt
          if-no-files-found: error
