name: wave122-termination-exception-rollback

on:
  push:
    branches:
      - chatgpt/lane-001-platform-extract
    paths:
      - tools/AXM_FLOWING_COMPUTE_TERMINATION_EXCEPTION_ROLLBACK.py
      - tools/AXM_FLOWING_COMPUTE_TERMINATION_EXCEPTION_ROLLBACK_SELFTEST.py
      - .github/workflows/wave122-termination-exception-rollback.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare report directory
        run: mkdir -p wave122-report
      - name: Syntax check exact Wave 122 tools
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: python -m py_compile tools/AXM_FLOWING_COMPUTE_TERMINATION_EXCEPTION_ROLLBACK.py tools/AXM_FLOWING_COMPUTE_TERMINATION_EXCEPTION_ROLLBACK_SELFTEST.py
      - name: Wave 121 unchanged regression
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: python tools/AXM_FLOWING_COMPUTE_ROTATION_PREPARE_PUBLICATION_ATOMICITY_SELFTEST.py --json-out wave122-report/wave121-regression.json
      - name: Wave 121 unchanged regression optimized
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: python -O tools/AXM_FLOWING_COMPUTE_ROTATION_PREPARE_PUBLICATION_ATOMICITY_SELFTEST.py --json-out wave122-report/wave121-regression-optimized.json
      - name: Wave 122 exact-source self-test
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: python tools/AXM_FLOWING_COMPUTE_TERMINATION_EXCEPTION_ROLLBACK_SELFTEST.py --json-out wave122-report/wave122.json
      - name: Wave 122 optimized-mode self-test
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: python -O tools/AXM_FLOWING_COMPUTE_TERMINATION_EXCEPTION_ROLLBACK_SELFTEST.py --json-out wave122-report/wave122-optimized.json
      - name: Record exact source identity
        run: |
          python - <<'PY'
          import json, subprocess
          files = [
              'tools/AXM_FLOWING_COMPUTE_TERMINATION_EXCEPTION_ROLLBACK.py',
              'tools/AXM_FLOWING_COMPUTE_TERMINATION_EXCEPTION_ROLLBACK_SELFTEST.py',
              '.github/workflows/wave122-termination-exception-rollback.yml',
              'tools/AXM_FLOWING_COMPUTE_ROTATION_PREPARE_PUBLICATION_ATOMICITY.py',
              'tools/AXM_FLOWING_COMPUTE_ROTATION_PREPARE_PUBLICATION_ATOMICITY_SELFTEST.py',
          ]
          out = {
              'tested_source_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'blobs': {
                  path: subprocess.check_output(['git','hash-object',path], text=True).strip()
                  for path in files
              },
              'verifier_pr': 46,
              'verifier_run': 35275924241,
              'truth_boundary': 'single same-process BaseException rollback while restore path runs; no hard kill/power-loss/process/store independence; no performance/energy/retained-compute claim',
          }
          with open('wave122-report/source-identity.json','w',encoding='utf-8') as f:
              json.dump(out,f,indent=2,sort_keys=True)
              f.write('\n')
          PY
      - name: Upload machine-readable run report
        uses: actions/upload-artifact@v4
        with:
          name: wave122-report
          path: wave122-report/
          if-no-files-found: error
