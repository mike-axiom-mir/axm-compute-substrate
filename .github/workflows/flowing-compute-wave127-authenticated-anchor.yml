name: flowing-compute-wave127-authenticated-anchor

on:
  push:
    branches:
      - chatgpt/lane-001-platform-extract
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: OpenSSL identity
        run: |
          openssl version

      - name: Unchanged Wave 126 regression normal
        env:
          PYTHONPATH: tools
        run: |
          python tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ANCHORED_SELFTEST.py --report /tmp/wave126-normal.json

      - name: Unchanged Wave 126 regression optimized
        env:
          PYTHONPATH: tools
        run: |
          python -O tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ANCHORED_SELFTEST.py --report /tmp/wave126-optimized.json

      - name: Wave 127 authenticated anchor normal
        env:
          PYTHONPATH: tools
        run: |
          python tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_AUTHENTICATED_ANCHOR_SELFTEST_FIXED.py --report /tmp/wave127-normal.json

      - name: Wave 127 authenticated anchor optimized
        env:
          PYTHONPATH: tools
        run: |
          python -O tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_AUTHENTICATED_ANCHOR_SELFTEST_FIXED.py --report /tmp/wave127-optimized.json

      - name: Exact source identity
        run: |
          git rev-parse HEAD > /tmp/source-head.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ANCHORED.py > /tmp/wave126-tool-blob.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ANCHORED_SELFTEST.py > /tmp/wave126-selftest-blob.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_AUTHENTICATED_ANCHOR.py > /tmp/wave127-tool-blob.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_AUTHENTICATED_ANCHOR_FIXED.py > /tmp/wave127-fixed-tool-blob.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_AUTHENTICATED_ANCHOR_SELFTEST.py > /tmp/wave127-selftest-blob.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_AUTHENTICATED_ANCHOR_SELFTEST_FIXED.py > /tmp/wave127-fixed-selftest-blob.txt
          git rev-parse HEAD:.github/workflows/flowing-compute-wave127-authenticated-anchor.yml > /tmp/wave127-workflow-blob.txt

      - name: Upload exact Wave 127 evidence
        uses: actions/upload-artifact@v4
        with:
          name: flowing-compute-wave127-authenticated-anchor-evidence
          path: |
            /tmp/wave126-normal.json
            /tmp/wave126-optimized.json
            /tmp/wave127-normal.json
            /tmp/wave127-optimized.json
            /tmp/source-head.txt
            /tmp/wave126-tool-blob.txt
            /tmp/wave126-selftest-blob.txt
            /tmp/wave127-tool-blob.txt
            /tmp/wave127-fixed-tool-blob.txt
            /tmp/wave127-selftest-blob.txt
            /tmp/wave127-fixed-selftest-blob.txt
            /tmp/wave127-workflow-blob.txt
          if-no-files-found: error
