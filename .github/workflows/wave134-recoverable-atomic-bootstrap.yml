name: Wave 134 recoverable atomic bootstrap

on:
  push:
    branches:
      - chatgpt/lane-001-platform-extract
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave134:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Environment identity
        run: |
          python --version
          openssl version
          uname -a
          id
          grep -E '^(Uid|Gid|CapPrm|CapEff|NoNewPrivs):' /proc/self/status || true
          sudo -n true

      - name: Stage UID-neutral test code
        run: |
          sudo rm -rf /tmp/axm-w134-code
          sudo mkdir -p /tmp/axm-w134-code
          sudo cp -a tools/. /tmp/axm-w134-code/
          sudo find /tmp/axm-w134-code -type d -exec chmod 0755 {} +
          sudo find /tmp/axm-w134-code -type f -exec chmod 0644 {} +

      - name: Unchanged Wave 133 regression normal
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w134-code HOME=/tmp python /tmp/axm-w134-code/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ROTATION_BOOTSTRAP_RECOVERY_SELFTEST.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/wave133-normal.json' sh "$worker_uid"

      - name: Unchanged Wave 133 regression optimized
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w134-code HOME=/tmp python -O /tmp/axm-w134-code/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ROTATION_BOOTSTRAP_RECOVERY_SELFTEST.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/wave133-optimized.json' sh "$worker_uid"

      - name: Wave 134 atomic recovery normal
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w134-code HOME=/tmp python /tmp/axm-w134-code/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ATOMIC_RECOVERY_SELFTEST.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/wave134-normal.json' sh "$worker_uid"

      - name: Wave 134 atomic recovery optimized
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w134-code HOME=/tmp python -O /tmp/axm-w134-code/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ATOMIC_RECOVERY_SELFTEST.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/wave134-optimized.json' sh "$worker_uid"

      - name: Exact source identity
        run: |
          git rev-parse HEAD > /tmp/tested-head.txt
          git rev-parse HEAD^ > /tmp/tested-parent.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ROTATION_BOOTSTRAP_RECOVERY.py > /tmp/wave133-tool-blob.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ATOMIC_RECOVERY.py > /tmp/wave134-tool-blob.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ATOMIC_RECOVERY_SELFTEST.py > /tmp/wave134-selftest-blob.txt
          git rev-parse HEAD:.github/workflows/wave134-recoverable-atomic-bootstrap.yml > /tmp/wave134-workflow-blob.txt

      - name: Upload exact Wave 134 evidence
        uses: actions/upload-artifact@v4
        with:
          name: wave134-recoverable-atomic-bootstrap
          path: |
            /tmp/wave133-normal.json
            /tmp/wave133-optimized.json
            /tmp/wave134-normal.json
            /tmp/wave134-optimized.json
            /tmp/tested-head.txt
            /tmp/tested-parent.txt
            /tmp/wave133-tool-blob.txt
            /tmp/wave134-tool-blob.txt
            /tmp/wave134-selftest-blob.txt
            /tmp/wave134-workflow-blob.txt
          if-no-files-found: error
