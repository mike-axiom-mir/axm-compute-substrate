name: Verifier Wave 132 rotation gate path swap

on:
  push:
    branches:
      - verifier/wave132-rotation-gate-path-swap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Environment identity
        run: |
          python --version
          openssl version
          uname -a
          id
          grep -E '^(Uid|Gid|CapPrm|CapEff|NoNewPrivs):' /proc/self/status || true
          sudo -n true

      - name: Stage UID-neutral code
        run: |
          sudo rm -rf /tmp/axm-w132-verifier
          sudo mkdir -p /tmp/axm-w132-verifier/tools /tmp/axm-w132-verifier/verification
          sudo cp -a tools/. /tmp/axm-w132-verifier/tools/
          sudo cp verification/wave132_rotation_gate_path_swap_repro.py /tmp/axm-w132-verifier/verification/
          sudo find /tmp/axm-w132-verifier -type d -exec chmod 0755 {} +
          sudo find /tmp/axm-w132-verifier -type f -exec chmod 0644 {} +

      - name: Unchanged Wave 132 control normal
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w132-verifier/tools HOME=/tmp python /tmp/axm-w132-verifier/tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_KEY_ROTATION_SELFTEST.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/wave132-control-normal.json' sh "$worker_uid"

      - name: Unchanged Wave 132 control optimized
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w132-verifier/tools HOME=/tmp python -O /tmp/axm-w132-verifier/tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_KEY_ROTATION_SELFTEST.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/wave132-control-optimized.json' sh "$worker_uid"

      - name: Adversarial rotation-gate path swap normal
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w132-verifier/tools HOME=/tmp python /tmp/axm-w132-verifier/verification/wave132_rotation_gate_path_swap_repro.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/wave132-path-swap-normal.json' sh "$worker_uid"

      - name: Adversarial rotation-gate path swap optimized
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w132-verifier/tools HOME=/tmp python -O /tmp/axm-w132-verifier/verification/wave132_rotation_gate_path_swap_repro.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/wave132-path-swap-optimized.json' sh "$worker_uid"

      - name: Exact provenance
        run: |
          printf '%s\n' '60865699c2c2fe1f53860bcb5d0196860ee98086' > /tmp/challenged-builder-head.txt
          git rev-parse 60865699c2c2fe1f53860bcb5d0196860ee98086:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_KEY_ROTATION.py > /tmp/wave132-tool-blob.txt
          git rev-parse 60865699c2c2fe1f53860bcb5d0196860ee98086:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_KEY_ROTATION_SELFTEST.py > /tmp/wave132-selftest-blob.txt
          git rev-parse 60865699c2c2fe1f53860bcb5d0196860ee98086:.github/workflows/wave132-predecessor-key-rotation.yml > /tmp/wave132-builder-workflow-blob.txt
          git rev-parse HEAD > /tmp/verifier-head.txt
          git rev-parse HEAD:verification/wave132_rotation_gate_path_swap_repro.py > /tmp/verifier-script-blob.txt
          git rev-parse HEAD:.github/workflows/verifier-wave132-rotation-gate-path-swap.yml > /tmp/verifier-workflow-blob.txt

      - name: Upload verifier evidence
        uses: actions/upload-artifact@v4
        with:
          name: wave132-rotation-gate-path-swap-verifier
          path: |
            /tmp/wave132-control-normal.json
            /tmp/wave132-control-optimized.json
            /tmp/wave132-path-swap-normal.json
            /tmp/wave132-path-swap-optimized.json
            /tmp/challenged-builder-head.txt
            /tmp/wave132-tool-blob.txt
            /tmp/wave132-selftest-blob.txt
            /tmp/wave132-builder-workflow-blob.txt
            /tmp/verifier-head.txt
            /tmp/verifier-script-blob.txt
            /tmp/verifier-workflow-blob.txt
          if-no-files-found: error
