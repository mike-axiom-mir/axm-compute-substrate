name: Wave 131 serve diagnostic

on:
  push:
    branches: [chatgpt/lane-001-platform-extract]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage code
        run: |
          sudo rm -rf /tmp/axm-w131-probe-code
          sudo mkdir -p /tmp/axm-w131-probe-code
          sudo cp -a tools/. /tmp/axm-w131-probe-code/
          sudo find /tmp/axm-w131-probe-code -type d -exec chmod 0755 {} +
          sudo find /tmp/axm-w131-probe-code -type f -exec chmod 0644 {} +
      - name: Probe recovered serve start
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w131-probe-code HOME=/tmp AXM_PROBE_WORKER_UID="$1" python /tmp/axm-w131-probe-code/AXM_W131_SERVE_PROBE.py' sh "$worker_uid"
