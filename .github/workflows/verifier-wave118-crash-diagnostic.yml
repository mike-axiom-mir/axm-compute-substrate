name: verifier-wave118-crash-diagnostic

on:
  push:
    branches:
      - verifier/wave118-rotation-provenance-crash
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run verifier and preserve stdout stderr
        id: repro
        continue-on-error: true
        shell: bash
        run: |
          set +e
          PYTHONPATH=tools python verification/wave118_rotation_provenance_crash_repro.py > /tmp/verifier.json 2> /tmp/verifier.stderr
          code=$?
          echo "$code" > /tmp/verifier.exit
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-wave118-fast-diagnostic
          path: |
            /tmp/verifier.json
            /tmp/verifier.stderr
            /tmp/verifier.exit
          if-no-files-found: error
