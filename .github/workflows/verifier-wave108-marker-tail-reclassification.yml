name: Verifier Wave 108 marker-tail reclassification

on:
  push:
    branches:
      - verifier/wave108-marker-tail-reclassification
    paths:
      - "verification/wave108_marker_tail_reclassification_repro.py"
      - "verification/WAVE108_ADVERSARIAL_VERIFICATION_2026-09-17.md"
      - ".github/workflows/verifier-wave108-marker-tail-reclassification.yml"
  pull_request:
    branches:
      - chatgpt/lane-001-platform-extract
    paths:
      - "verification/wave108_marker_tail_reclassification_repro.py"
      - "verification/WAVE108_ADVERSARIAL_VERIFICATION_2026-09-17.md"
      - ".github/workflows/verifier-wave108-marker-tail-reclassification.yml"
      - "tools/AXM_FLOWING_COMPUTE_COMMITTED_HISTORY_MANIFEST.py"
      - "tools/AXM_FLOWING_COMPUTE_COMMITTED_HISTORY_MANIFEST_SELFTEST.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-reproduction:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-run unchanged Wave 108 builder self-test
        if: matrix.mode == 'normal'
        run: python tools/AXM_FLOWING_COMPUTE_COMMITTED_HISTORY_MANIFEST_SELFTEST.py > /tmp/wave108-builder.json
      - name: Reproduce marker-tail commit-status loss
        if: matrix.mode == 'normal'
        run: python verification/wave108_marker_tail_reclassification_repro.py | tee /tmp/wave108-verifier-normal.json
      - name: Reproduce marker-tail commit-status loss under python -O
        if: matrix.mode == 'optimized'
        run: python -O verification/wave108_marker_tail_reclassification_repro.py | tee /tmp/wave108-verifier-optimized.json
      - name: Require explicit verifier failure verdict
        shell: bash
        run: |
          if [ "${{ matrix.mode }}" = "optimized" ]; then
            REPORT=/tmp/wave108-verifier-optimized.json
          else
            REPORT=/tmp/wave108-verifier-normal.json
          fi
          python - "$REPORT" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          verdict = report["verdict"]
          if not verdict.startswith("FAIL_"):
              raise SystemExit(f"counterexample did not reproduce: {verdict}")
          print(verdict)
          print(report["attack"]["authority"])
          print(report["attack"]["committed_history_state"]["status"])
          PY
