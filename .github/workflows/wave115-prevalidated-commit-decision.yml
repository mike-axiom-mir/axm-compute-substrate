name: Wave 115 prevalidated commit decision

on:
  push:
    branches:
      - chatgpt/lane-001-platform-extract
    paths:
      - 'tools/AXM_FLOWING_COMPUTE_PREVALIDATED_COMMIT_DECISION.py'
      - 'tools/AXM_FLOWING_COMPUTE_PREVALIDATED_COMMIT_DECISION_SELFTEST.py'
      - '.github/workflows/wave115-prevalidated-commit-decision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave115:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wave 114 regression
        run: python tools/AXM_FLOWING_COMPUTE_EXACT_TRANSITION_DECISION_SELFTEST_RUNNER.py --json-out evidence/wave115_wave114_regression.json
      - name: Wave 115 normal Python
        run: python tools/AXM_FLOWING_COMPUTE_PREVALIDATED_COMMIT_DECISION_SELFTEST.py --json-out evidence/wave115_normal.json
      - name: Wave 115 optimized Python
        run: python -O tools/AXM_FLOWING_COMPUTE_PREVALIDATED_COMMIT_DECISION_SELFTEST.py --json-out evidence/wave115_optimized.json
      - name: Upload exact-run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave115-prevalidated-commit-decision-reports
          path: |
            evidence/wave115_wave114_regression.json
            evidence/wave115_normal.json
            evidence/wave115_optimized.json
          if-no-files-found: warn
