name: Verifier Wave 134 rotation private-temp residue

on:
  push:
    branches:
      - verifier/wave134-rotation-private-temp-residue
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Environment identity
        run: |
          python --version
          openssl version
          uname -a
          id
          grep -E '^(Uid|Gid|CapPrm|CapEff|NoNewPrivs):' /proc/self/status || true
          sudo -n true

      - name: Stage UID-neutral code
        run: |
          sudo rm -rf /tmp/axm-w134-verifier-code
          sudo mkdir -p /tmp/axm-w134-verifier-code
          sudo cp -a tools/. /tmp/axm-w134-verifier-code/
          sudo cp verification/wave134_rotation_private_temp_residue_repro.py /tmp/axm-w134-verifier-code/
          sudo find /tmp/axm-w134-verifier-code -type d -exec chmod 0755 {} +
          sudo find /tmp/axm-w134-verifier-code -type f -exec chmod 0644 {} +

      - name: Unchanged Wave 134 builder control normal
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w134-verifier-code HOME=/tmp python /tmp/axm-w134-verifier-code/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ATOMIC_RECOVERY_SELFTEST.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/builder-wave134-normal.json' sh "$worker_uid"

      - name: Unchanged Wave 134 builder control optimized
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w134-verifier-code HOME=/tmp python -O /tmp/axm-w134-verifier-code/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ATOMIC_RECOVERY_SELFTEST.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/builder-wave134-optimized.json' sh "$worker_uid"

      - name: Adversarial private-temp residue normal
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w134-verifier-code HOME=/tmp python /tmp/axm-w134-verifier-code/wave134_rotation_private_temp_residue_repro.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/verifier-normal.json' sh "$worker_uid"

      - name: Adversarial private-temp residue optimized
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w134-verifier-code HOME=/tmp python -O /tmp/axm-w134-verifier-code/wave134_rotation_private_temp_residue_repro.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/verifier-optimized.json' sh "$worker_uid"

      - name: Exact source identity
        run: |
          git rev-parse HEAD > /tmp/verifier-head.txt
          git rev-parse HEAD^ > /tmp/verifier-parent.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ATOMIC_RECOVERY.py > /tmp/wave134-tool-blob.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ATOMIC_RECOVERY_SELFTEST.py > /tmp/wave134-selftest-blob.txt
          git rev-parse HEAD:verification/wave134_rotation_private_temp_residue_repro.py > /tmp/verifier-repro-blob.txt
          git rev-parse HEAD:.github/workflows/verifier-wave134-rotation-private-temp-residue.yml > /tmp/verifier-workflow-blob.txt

      - name: Upload verifier evidence
        uses: actions/upload-artifact@v4
        with:
          name: wave134-rotation-private-temp-residue-verifier
          path: |
            /tmp/builder-wave134-normal.json
            /tmp/builder-wave134-optimized.json
            /tmp/verifier-normal.json
            /tmp/verifier-optimized.json
            /tmp/verifier-head.txt
            /tmp/verifier-parent.txt
            /tmp/wave134-tool-blob.txt
            /tmp/wave134-selftest-blob.txt
            /tmp/verifier-repro-blob.txt
            /tmp/verifier-workflow-blob.txt
          if-no-files-found: error
