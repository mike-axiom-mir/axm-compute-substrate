name: Wave 111 transition provenance ledger

on:
  push:
    branches:
      - chatgpt/lane-001-platform-extract
    paths:
      - 'tools/AXM_FLOWING_COMPUTE_TRANSITION_PROVENANCE_LEDGER.py'
      - 'tools/AXM_FLOWING_COMPUTE_TRANSITION_PROVENANCE_LEDGER_SELFTEST.py'
      - '.github/workflows/wave111-transition-provenance-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave111:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wave 110 regression
        run: python tools/AXM_FLOWING_COMPUTE_TRANSITION_EVIDENCE_GUARD_SELFTEST.py --json-out evidence/wave111_wave110_regression.json
      - name: Wave 111 normal Python
        run: python tools/AXM_FLOWING_COMPUTE_TRANSITION_PROVENANCE_LEDGER_SELFTEST.py --json-out evidence/wave111_normal.json
      - name: Wave 111 optimized Python
        run: python -O tools/AXM_FLOWING_COMPUTE_TRANSITION_PROVENANCE_LEDGER_SELFTEST.py --json-out evidence/wave111_optimized.json
      - name: Upload exact-run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave111-transition-provenance-reports
          path: |
            evidence/wave111_wave110_regression.json
            evidence/wave111_normal.json
            evidence/wave111_optimized.json
          if-no-files-found: warn
