name: wave119-crash-recoverable-rotation-lineage

on:
  push:
    branches:
      - chatgpt/lane-001-platform-extract
    paths:
      - tools/AXM_FLOWING_COMPUTE_CRASH_RECOVERABLE_ROTATION_LINEAGE.py
      - tools/AXM_FLOWING_COMPUTE_CRASH_RECOVERABLE_ROTATION_LINEAGE_SELFTEST.py
      - .github/workflows/wave119-crash-recoverable-rotation-lineage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare report directory
        run: mkdir -p wave119-report
      - name: Wave 118 regression
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: python tools/AXM_FLOWING_COMPUTE_OUTCOME_AUTHORITY_ROTATION_LINEAGE_SELFTEST.py --json-out wave119-report/wave118-regression.json
      - name: Wave 118 optimized regression
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: python -O tools/AXM_FLOWING_COMPUTE_OUTCOME_AUTHORITY_ROTATION_LINEAGE_SELFTEST.py --json-out wave119-report/wave118-regression-optimized.json
      - name: Wave 119 exact-source self-test
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: python tools/AXM_FLOWING_COMPUTE_CRASH_RECOVERABLE_ROTATION_LINEAGE_SELFTEST.py --json-out wave119-report/wave119.json
      - name: Wave 119 optimized-mode self-test
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: python -O tools/AXM_FLOWING_COMPUTE_CRASH_RECOVERABLE_ROTATION_LINEAGE_SELFTEST.py --json-out wave119-report/wave119-optimized.json
      - name: Record exact source identity
        run: |
          python - <<'PY'
          import json, subprocess
          files = [
              'tools/AXM_FLOWING_COMPUTE_CRASH_RECOVERABLE_ROTATION_LINEAGE.py',
              'tools/AXM_FLOWING_COMPUTE_CRASH_RECOVERABLE_ROTATION_LINEAGE_SELFTEST.py',
              '.github/workflows/wave119-crash-recoverable-rotation-lineage.yml',
              'tools/AXM_FLOWING_COMPUTE_OUTCOME_AUTHORITY_ROTATION_LINEAGE.py',
          ]
          out = {
              'tested_source_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'blobs': {
                  path: subprocess.check_output(['git','hash-object',path], text=True).strip()
                  for path in files
              },
              'truth_boundary': 'same-process crash/retry correctness only; not process/device/provider independence or performance/energy evidence',
          }
          with open('wave119-report/source-identity.json','w',encoding='utf-8') as f:
              json.dump(out,f,indent=2,sort_keys=True)
              f.write('\n')
          PY
      - name: Upload machine-readable run report
        uses: actions/upload-artifact@v4
        with:
          name: wave119-report
          path: wave119-report/
          if-no-files-found: error
