name: Verifier Wave 104 registry root substitution

on:
  push:
    branches:
      - verifier/wave104-registry-root-substitution
    paths:
      - 'verification/wave104_certificate_witness_registry_root_substitution_repro.py'
      - 'verification/WAVE104_ADVERSARIAL_VERIFICATION_2026-09-17.md'
      - '.github/workflows/verifier-wave104-registry-root-substitution.yml'
  pull_request:
    paths:
      - 'verification/wave104_certificate_witness_registry_root_substitution_repro.py'
      - 'verification/WAVE104_ADVERSARIAL_VERIFICATION_2026-09-17.md'
      - '.github/workflows/verifier-wave104-registry-root-substitution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-run unchanged Wave 104 self-test and verifier repro
        shell: bash
        run: |
          if [ "${{ matrix.mode }}" = "optimized" ]; then
            python -O tools/AXM_FLOWING_COMPUTE_CERTIFICATE_WITNESS_REGISTRY_SELFTEST.py
            python -O verification/wave104_certificate_witness_registry_root_substitution_repro.py
          else
            python tools/AXM_FLOWING_COMPUTE_CERTIFICATE_WITNESS_REGISTRY_SELFTEST.py
            python verification/wave104_certificate_witness_registry_root_substitution_repro.py
          fi
