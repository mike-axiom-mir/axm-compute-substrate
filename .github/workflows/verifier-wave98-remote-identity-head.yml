name: verifier-wave98-remote-identity-head

on:
  pull_request:
    branches:
      - chatgpt/lane-001-platform-extract
    paths:
      - "verification/wave98_remote_identity_head_repro.py"
      - "verification/WAVE98_ADVERSARIAL_REMOTE_IDENTITY_HEAD_2026-09-17.md"
      - "tools/AXM_FLOWING_COMPUTE_DUAL_REMOTE_WITNESS.py"
      - ".github/workflows/verifier-wave98-remote-identity-head.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce against exact Wave 98 source
        run: python verification/wave98_remote_identity_head_repro.py
      - name: Reproduce with optimized Python
        run: python -O verification/wave98_remote_identity_head_repro.py
