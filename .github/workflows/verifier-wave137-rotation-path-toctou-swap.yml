name: Verifier Wave 137 rotation path TOCTOU swap

on:
  push:
    branches:
      - verifier/wave137-rotation-path-toctou-swap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Environment identity
        run: |
          python --version
          openssl version
          uname -a
          id
          grep -E '^(Uid|Gid|CapPrm|CapEff|NoNewPrivs):' /proc/self/status || true
          sudo -n true

      - name: Stage UID-neutral test code
        run: |
          sudo rm -rf /tmp/axm-w137-verifier-code
          sudo mkdir -p /tmp/axm-w137-verifier-code
          sudo cp -a tools/. /tmp/axm-w137-verifier-code/
          sudo cp verification/wave137_rotation_path_toctou_swap_repro.py /tmp/axm-w137-verifier-code/verifier.py
          sudo find /tmp/axm-w137-verifier-code -type d -exec chmod 0755 {} +
          sudo find /tmp/axm-w137-verifier-code -type f -exec chmod 0644 {} +

      - name: Unchanged Wave 137 repaired suite normal
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w137-verifier-code HOME=/tmp python /tmp/axm-w137-verifier-code/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ROTATION_NAMESPACE_SELFTEST.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/wave137-control-normal.json' sh "$worker_uid"

      - name: Unchanged Wave 137 repaired suite optimized
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w137-verifier-code HOME=/tmp python -O /tmp/axm-w137-verifier-code/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ROTATION_NAMESPACE_SELFTEST.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/wave137-control-optimized.json' sh "$worker_uid"

      - name: Adversarial path swap normal
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w137-verifier-code HOME=/tmp python /tmp/axm-w137-verifier-code/verifier.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/wave137-toctou-normal.json' sh "$worker_uid"

      - name: Adversarial path swap optimized
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w137-verifier-code HOME=/tmp python -O /tmp/axm-w137-verifier-code/verifier.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/wave137-toctou-optimized.json' sh "$worker_uid"

      - name: Exact source identity
        run: |
          git rev-parse HEAD > /tmp/verifier-head.txt
          git rev-parse HEAD^ > /tmp/verifier-parent.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ROTATION_NAMESPACE.py > /tmp/wave137-tool-blob.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_ROTATION_NAMESPACE_SELFTEST.py > /tmp/wave137-selftest-blob.txt
          git rev-parse HEAD:verification/wave137_rotation_path_toctou_swap_repro.py > /tmp/verifier-blob.txt
          git rev-parse HEAD:.github/workflows/verifier-wave137-rotation-path-toctou-swap.yml > /tmp/verifier-workflow-blob.txt

      - name: Upload verifier evidence
        uses: actions/upload-artifact@v4
        with:
          name: wave137-rotation-path-toctou-verifier
          path: |
            /tmp/wave137-control-normal.json
            /tmp/wave137-control-optimized.json
            /tmp/wave137-toctou-normal.json
            /tmp/wave137-toctou-optimized.json
            /tmp/verifier-head.txt
            /tmp/verifier-parent.txt
            /tmp/wave137-tool-blob.txt
            /tmp/wave137-selftest-blob.txt
            /tmp/verifier-blob.txt
            /tmp/verifier-workflow-blob.txt
          if-no-files-found: error
