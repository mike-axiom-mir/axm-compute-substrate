name: wave120-rotation-prepare-transaction

on:
  push:
    branches:
      - chatgpt/lane-001-platform-extract
    paths:
      - tools/AXM_FLOWING_COMPUTE_ROTATION_PREPARE_TRANSACTION.py
      - tools/AXM_FLOWING_COMPUTE_ROTATION_PREPARE_TRANSACTION_SELFTEST.py
      - .github/workflows/wave120-rotation-prepare-transaction.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare report directory
        run: mkdir -p wave120-report
      - name: Wave 119 regression
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: python tools/AXM_FLOWING_COMPUTE_CRASH_RECOVERABLE_ROTATION_LINEAGE_SELFTEST.py --json-out wave120-report/wave119-regression.json
      - name: Wave 119 optimized regression
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: python -O tools/AXM_FLOWING_COMPUTE_CRASH_RECOVERABLE_ROTATION_LINEAGE_SELFTEST.py --json-out wave120-report/wave119-regression-optimized.json
      - name: Wave 120 exact-source self-test
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: python tools/AXM_FLOWING_COMPUTE_ROTATION_PREPARE_TRANSACTION_SELFTEST.py --json-out wave120-report/wave120.json
      - name: Wave 120 optimized-mode self-test
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: python -O tools/AXM_FLOWING_COMPUTE_ROTATION_PREPARE_TRANSACTION_SELFTEST.py --json-out wave120-report/wave120-optimized.json
      - name: Record exact source identity
        run: |
          python - <<'PY'
          import json, subprocess
          files = [
              'tools/AXM_FLOWING_COMPUTE_ROTATION_PREPARE_TRANSACTION.py',
              'tools/AXM_FLOWING_COMPUTE_ROTATION_PREPARE_TRANSACTION_SELFTEST.py',
              '.github/workflows/wave120-rotation-prepare-transaction.yml',
              'tools/AXM_FLOWING_COMPUTE_CRASH_RECOVERABLE_ROTATION_LINEAGE.py',
          ]
          out = {
              'tested_source_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'blobs': {
                  path: subprocess.check_output(['git','hash-object',path], text=True).strip()
                  for path in files
              },
              'truth_boundary': 'same-process exception rollback and retained-state storage hygiene only; 1/10/100/1000 failure scaling is object/byte accounting, not timing/energy evidence',
          }
          with open('wave120-report/source-identity.json','w',encoding='utf-8') as f:
              json.dump(out,f,indent=2,sort_keys=True)
              f.write('\n')
          PY
      - name: Upload machine-readable run report
        uses: actions/upload-artifact@v4
        with:
          name: wave120-report
          path: wave120-report/
          if-no-files-found: error
