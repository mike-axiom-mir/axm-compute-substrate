name: Wave 132 predecessor key rotation

on:
  push:
    branches:
      - chatgpt/lane-001-platform-extract
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave132:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Environment identity
        run: |
          python --version
          openssl version
          uname -a
          id
          grep -E '^(Uid|Gid|CapPrm|CapEff|NoNewPrivs):' /proc/self/status || true
          sudo -n true

      - name: Stage UID-neutral test code
        run: |
          sudo rm -rf /tmp/axm-w132-code
          sudo mkdir -p /tmp/axm-w132-code
          sudo cp -a tools/. /tmp/axm-w132-code/
          sudo find /tmp/axm-w132-code -type d -exec chmod 0755 {} +
          sudo find /tmp/axm-w132-code -type f -exec chmod 0644 {} +

      - name: Unchanged Wave 131 regression normal
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w132-code HOME=/tmp python /tmp/axm-w132-code/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_INIT_RECOVERY_SELFTEST.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/wave131-normal.json' sh "$worker_uid"

      - name: Unchanged Wave 131 regression optimized
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w132-code HOME=/tmp python -O /tmp/axm-w132-code/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_INIT_RECOVERY_SELFTEST.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/wave131-optimized.json' sh "$worker_uid"

      - name: Wave 132 predecessor-authorized rotation normal
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w132-code HOME=/tmp python /tmp/axm-w132-code/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_KEY_ROTATION_SELFTEST.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/wave132-normal.json' sh "$worker_uid"

      - name: Wave 132 predecessor-authorized rotation optimized
        run: |
          worker_uid="$(id -u)"
          sudo sh -c 'umask 000; exec env PYTHONPATH=/tmp/axm-w132-code HOME=/tmp python -O /tmp/axm-w132-code/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_KEY_ROTATION_SELFTEST.py --worker-uid "$1" --anchor-uid 23001 --report /tmp/wave132-optimized.json' sh "$worker_uid"

      - name: Exact source identity
        run: |
          git rev-parse HEAD > /tmp/tested-head.txt
          git rev-parse HEAD^ > /tmp/tested-parent.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_INIT_RECOVERY.py > /tmp/wave131-tool-blob.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_KEY_ROTATION.py > /tmp/wave132-tool-blob.txt
          git rev-parse HEAD:tools/AXM_FLOWING_COMPUTE_PROCESS_WITNESS_KEY_ROTATION_SELFTEST.py > /tmp/wave132-selftest-blob.txt
          git rev-parse HEAD:.github/workflows/wave132-predecessor-key-rotation.yml > /tmp/wave132-workflow-blob.txt

      - name: Upload exact Wave 132 evidence
        uses: actions/upload-artifact@v4
        with:
          name: wave132-predecessor-key-rotation
          path: |
            /tmp/wave131-normal.json
            /tmp/wave131-optimized.json
            /tmp/wave132-normal.json
            /tmp/wave132-optimized.json
            /tmp/tested-head.txt
            /tmp/tested-parent.txt
            /tmp/wave131-tool-blob.txt
            /tmp/wave132-tool-blob.txt
            /tmp/wave132-selftest-blob.txt
            /tmp/wave132-workflow-blob.txt
          if-no-files-found: error
